name: Build and deploy Bink converter

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EMSDK_VERSION: 6.0.1
      PREFIX: ${{ github.workspace }}/wasm-prefix

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate web app
        run: |
          node --check app.js
          node --check bink2-worker.js

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config autoconf automake libtool nasm yasm curl

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Fetch FFmpeg 7.1.2 and patch Bink2
        run: |
          git clone --depth 1 --branch n7.1.2 https://github.com/FFmpeg/FFmpeg.git ffmpeg
          curl -fL https://raw.githubusercontent.com/sharpemu/ffmpeg-core/master/bink2.patch -o bink2.patch
          cd ffmpeg
          git apply ../bink2.patch
          sed -i 's/c->has_alpha = c->flags & BINK_FLAG_ALPHA;/c->has_alpha = !!(c->flags \& BINK_FLAG_ALPHA);/' libavcodec/bink2.c
          grep -F 'c->has_alpha = !!(c->flags & BINK_FLAG_ALPHA);' libavcodec/bink2.c

      - name: Build multithreaded libvpx VP8/VP9 encoders for WASM
        run: |
          git clone --depth 1 --branch v1.16.0 https://chromium.googlesource.com/webm/libvpx libvpx
          mkdir -p "$PREFIX"
          cd libvpx
          CFLAGS='-O3 -msimd128 -pthread' LDFLAGS='-pthread' \
          emconfigure ./configure \
            --prefix="$PREFIX" \
            --target=generic-gnu \
            --disable-shared \
            --enable-static \
            --disable-examples \
            --disable-tools \
            --disable-docs \
            --disable-unit-tests \
            --enable-vp8 \
            --enable-vp8-encoder \
            --disable-vp8-decoder \
            --enable-vp9 \
            --enable-vp9-encoder \
            --disable-vp9-decoder \
            --enable-multithread \
            --disable-runtime-cpu-detect \
            --disable-webm-io \
            --disable-libyuv \
            --extra-cflags='-O3 -msimd128 -pthread'
          emmake make -j"$(nproc)"
          emmake make install

      - name: Build libopus for WASM audio output
        run: |
          curl -fL https://downloads.xiph.org/releases/opus/opus-1.5.2.tar.gz -o opus.tar.gz
          tar -xzf opus.tar.gz
          cd opus-1.5.2
          CFLAGS='-O3 -msimd128 -pthread' LDFLAGS='-pthread' \
          emconfigure ./configure \
            --prefix="$PREFIX" \
            --disable-shared \
            --enable-static \
            --disable-doc \
            --disable-extra-programs \
            --disable-intrinsics
          emmake make -j"$(nproc)"
          emmake make install

      - name: Configure optimized FFmpeg libraries
        run: |
          cd ffmpeg
          emconfigure ./configure \
            --target-os=none \
            --arch=x86_32 \
            --enable-cross-compile \
            --disable-x86asm \
            --disable-inline-asm \
            --disable-stripping \
            --disable-doc \
            --disable-debug \
            --disable-autodetect \
            --disable-all \
            --disable-network \
            --disable-iconv \
            --disable-runtime-cpudetect \
            --enable-pthreads \
            --disable-w32threads \
            --disable-os2threads \
            --disable-programs \
            --enable-avcodec \
            --enable-avformat \
            --enable-swresample \
            --enable-decoder=binkvideo,bink2,binkaudio_dct,binkaudio_rdft \
            --enable-demuxer=bink \
            --enable-muxer=webm \
            --enable-encoder=libvpx_vp8,libvpx_vp9,libopus \
            --enable-bsf=vp9_superframe \
            --enable-protocol=file \
            --enable-libvpx \
            --enable-libopus \
            --cc=emcc \
            --cxx=em++ \
            --ar=emar \
            --ranlib=emranlib \
            --nm=emnm \
            --pkg-config=true \
            --optflags='-O3 -msimd128 -pthread' \
            --extra-cflags="-O3 -msimd128 -pthread -I$PREFIX/include -I$PREFIX/include/opus" \
            --extra-ldflags="-O3 -msimd128 -pthread -L$PREFIX/lib" \
            --extra-libs='-lvpx -lopus -lm'
          grep -E 'CONFIG_BINKVIDEO_DECODER=yes|CONFIG_BINK2_DECODER=yes|CONFIG_LIBVPX_VP8_ENCODER=yes|CONFIG_LIBVPX_VP9_ENCODER=yes|CONFIG_LIBOPUS_ENCODER=yes|CONFIG_BINK_DEMUXER=yes|CONFIG_WEBM_MUXER=yes|CONFIG_VP9_SUPERFRAME_BSF=yes|CONFIG_SWRESAMPLE=yes' ffbuild/config.mak

      - name: Build FFmpeg libraries
        run: |
          cd ffmpeg
          emmake make -j"$(nproc)" \
            libavformat/libavformat.a \
            libavcodec/libavcodec.a \
            libswresample/libswresample.a \
            libavutil/libavutil.a

      - name: Link optimized threaded browser transcoder
        run: |
          mkdir -p dist
          emcc -include src/native_checkpoints.h -include src/vp8_fastpath.h \
            src/bink2_transcode.c src/opfs_io.c src/debug_trace.c \
            -Isrc -Iffmpeg \
            ffmpeg/libavformat/libavformat.a \
            ffmpeg/libavcodec/libavcodec.a \
            ffmpeg/libswresample/libswresample.a \
            ffmpeg/libavutil/libavutil.a \
            "$PREFIX/lib/libvpx.a" \
            "$PREFIX/lib/libopus.a" \
            -lm -O3 -msimd128 -pthread --no-entry \
            -lworkerfs.js \
            -sMODULARIZE=1 \
            -sEXPORT_NAME=createBink2Core \
            -sENVIRONMENT=web,worker,node \
            -sFORCE_FILESYSTEM=1 \
            -sALLOW_MEMORY_GROWTH=1 \
            -sINITIAL_MEMORY=536870912 \
            -sMAXIMUM_MEMORY=2147483648 \
            -sMEMORY_GROWTH_GEOMETRIC_STEP=0.5 \
            -sPTHREAD_POOL_SIZE=8 \
            -sPTHREAD_POOL_SIZE_STRICT=0 \
            -sEXPORTED_FUNCTIONS='["_transcode_bk2","_bink2_last_error"]' \
            -sEXPORTED_RUNTIME_METHODS='["FS","WORKERFS","UTF8ToString","ccall"]' \
            -o dist/bink2-core.js
          cp ffmpeg/COPYING.LGPLv2.1 dist/
          cp libvpx/LICENSE dist/LICENSE.libvpx
          cp opus-1.5.2/COPYING dist/LICENSE.opus
          file dist/*
          du -h dist/*

      - name: Assemble static site
        run: |
          rm -rf _site
          mkdir -p _site/core
          cp index.html app.js styles.css bink2-worker.js coi-serviceworker.js _site/
          cp dist/* _site/core/
          touch _site/.nojekyll

      - name: Upload WASM core artifact
        uses: actions/upload-artifact@v4
        with:
          name: bink2-web-core
          path: dist
          if-no-files-found: error
          retention-days: 14

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
